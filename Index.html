<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM. Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container py-5" style="max-width: 500px;">
        <h1 class="h3 mb-4">Калькулятор</h1>

        <div class="mb-3">
            <label for="num1" class="form-label">Первое число</label>
            <input type="number" step="any" class="form-control" id="num1" placeholder="Введите число">
        </div>

        <div class="mb-3">
            <label for="num2" class="form-label">Второе число</label>
            <input type="number" step="any" class="form-control" id="num2" placeholder="Введите число">
        </div>

        <div class="mb-3">
            <label for="operation" class="form-label">Операция</label>
            <select class="form-select" id="operation" aria-label="Выбор операции">
                <option value="add" selected>Сложение</option>
                <option value="subtract">Вычитание</option>
                <option value="multiply">Умножение</option>
                <option value="divide">Деление</option>
                <option value="power">Возведение в степень</option>
            </select>
        </div>

        <button id="calculateBtn" class="btn btn-primary w-100">Вычислить</button>

        <div class="mt-4 alert alert-info" id="result" role="alert">
            Результат появится здесь
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
